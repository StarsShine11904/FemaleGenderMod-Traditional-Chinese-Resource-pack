name: Package Minecraft Resource Pack

# on: workflow_dispatch 代表這是一個純手動觸發的工作流
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '資源包版本名稱 (這會成為檔名，例如: v1.0.0)'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出程式碼 (Checkout)
        # 這裡會自動根據你在介面上選擇的分支來拉取程式碼
        uses: actions/checkout@v4

      - name: 📦 打包資源包 (Zip files)
        run: |
          # 設定打包後的檔案名稱
          ZIP_NAME="ResourcePack-${{ github.event.inputs.version_name }}.zip"
          
          # 將當前目錄下的所有檔案壓縮
          # -r 代表遞迴處理資料夾
          # -x 代表排除特定不需要打包進遊戲的檔案，避免資源包過大
          zip -r "$ZIP_NAME" . -x "*.git*" -x ".github/*" -x "*.DS_Store" -x "README.md"
          
          # 將檔名記錄到環境變數，方便下一步驟讀取
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV

      - name: 📤 上傳打包結果 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-resource-pack-${{ github.event.inputs.version_name }}
          path: ${{ env.ZIP_FILE }}
          retention-days: 30 # 設定檔案保留天數，可自行調整
